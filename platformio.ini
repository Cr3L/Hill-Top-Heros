; Firmware build for the Cardputer ADV.
;
; The host test suite does NOT use this file — it is a plain g++ Makefile under
; test/ and deliberately needs no Arduino toolchain. See test/Makefile.
;
;   pio run              build firmware
;   pio run -t upload    flash
;   pio device monitor   serial log (115200)

[platformio]
; Sources live at the repo root, not in src/. This is a [platformio] option --
; setting it under [env:] is silently ignored and the build then fails looking
; for a src/ directory that does not exist.
src_dir = .

[env:cardputer_adv]
platform  = espressif32
; No cardputer/cardputer-adv board definition exists in the registry. The ADV is
; an ESP32-S3 module and M5's own Cardputer docs build against StampS3, so that
; is the base here. Confirmed against the actual chip with `esptool flash_id`:
; ESP32-S3 (QFN56) rev v0.2, embedded 8MB flash (GD), no PSRAM, 40MHz crystal —
; exactly what this board definition describes.
;
; Upload port is left to autodetection deliberately. The board hwid is 303A:1001
; and PlatformIO matches on it, so it will not wander onto an unrelated ACM
; device — worth knowing if your machine also enumerates something like a
; fingerprint reader on /dev/ttyACM0.
board     = m5stack-stamps3
framework = arduino

; Keeps the host test suite out of the firmware build: test/ is g++-only and
; includes stub/Arduino.h, which would collide with the real Arduino core.
build_src_filter = +<*.cpp> -<test/>

lib_deps =
	m5stack/M5Cardputer@^1.1.1
	jgromes/RadioLib@^7.7.1
	; Not used by this firmware. M5Cardputer's manifest depends on a bare
	; "IRremote": "*", and several different packages are registered under that
	; name — PlatformIO warns about the ambiguity and picks one. Pinning it here
	; is the only way to make that choice reproducible from this file.
	z3t0/IRremote@^4.7.1

; The S3 talks over native USB, so Serial is USB CDC. Without this the log()
; output in CardputerUi goes nowhere and bring-up is flying blind.
; ARDUINO_USB_MODE=1 is deliberately absent: the board definition already sets
; it in build.extra_flags.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall
	-Wextra

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
